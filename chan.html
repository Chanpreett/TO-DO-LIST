<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium To Do App</title>

<link rel="stylesheet" href="chan.css">
</head>

<body>

<div class="app">

<h1>🚀 My To-Do List</h1>

</div>

</div>

<ul id="taskList"></ul>

</div>

<script src="chan.js"></script>

</body>
</html>
